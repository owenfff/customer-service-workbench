<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>同程 · 实时接待记录</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#182b40;background:#f1f4f8;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dce3ec;padding:24px 5vw;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0 0 8px}p{margin:6px 0;color:#65768a;line-height:1.7}a{color:#2462ba;text-decoration:none}main{max-width:1100px;margin:24px auto;padding:0 24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;border:1px solid #dce3ec;border-radius:10px;padding:16px}.stat b{display:block;margin-top:8px;font-size:18px}.notice{margin:20px 0;padding:14px 18px;border-left:3px solid #3474c4;background:#e8f0fc;line-height:1.7}.card{background:white;margin:18px 0;border:1px solid #dce3ec;border-radius:12px;padding:20px}.meta{display:flex;justify-content:space-between;color:#66788c;font-size:12px;margin-bottom:16px}.bubble{padding:12px 16px;background:#f0f3f7;border-radius:10px;max-width:82%;line-height:1.7;white-space:pre-wrap}.answer{background:#e8f2ff;margin:12px 0 8px auto}.label{text-align:right;font-size:12px;color:#52759c;margin-top:14px}.source{color:#718095;font-size:12px;margin-top:12px;line-height:1.6}.empty{text-align:center;background:white;border:1px dashed #c6d1df;border-radius:12px;padding:55px 20px}.error{color:#b23c31}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}header{align-items:flex-start}.bubble{max-width:96%}}
</style>
<header><div><h1>同程 · 实时接待记录</h1><p>真实新消息 → 知识检索 → DeepSeek 短回复 · 发送状态逐条记录</p></div><a href="/">返回接待台 →</a></header>
<main><div class="stats"><div class="stat">消息连接<b id="connection">检查中</b></div><div class="stat">模型 API<b id="model">检查中</b></div><div class="stat">本页真实文本<b id="count">—</b></div><div class="stat">最近客户文本<b id="last">尚未收到</b></div></div>
<div class="notice" id="notice">正在读取实时监听状态…</div><p id="refresh"></p><p id="platform-check"></p><section id="feed"></section><details><summary>事件诊断（已读、输入状态不当作咨询）</summary><p id="diagnostics"></p></details></main>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>s?new Date(s).toLocaleString('zh-CN',{hour12:false}):'尚未收到';
const statuses={server_accepted:'已发送 · 服务器已接受，客户侧送达待核实',customer_confirmed:'客户侧已确认收到',sending:'发送处理中',uncertain:'结果不确定，禁止重发',pending:'已生成，等待发送前校验',human_review:'需要人工处理',cancelled:'已取消，不会发送',shadow_acknowledgement_ready:'简短接话',shadow_draft_ready:'LLM 模拟回复',shadow_clarification_ready:'LLM 追问',superseded:'客户有新消息，旧候选已失效',unsupported_message:'非文本消息，需人工查看',shadow_model_or_citation_error:'模型或引用校验失败',source_insufficient:'缺少对应规则，未生成回复（转人工）',human_takeover:'人工接待中'};
async function refresh(){try{let r=await fetch('/shadow/live/data',{cache:'no-store'});if(r.status===401){location.href='/';return}if(!r.ok)throw Error('读取失败');const d=await r.json();
$('connection').textContent=d.transport.online?(d.active?'在线 · 监听中':'在线 · 监听暂停'):'未连接';$('model').textContent=d.model.enabled?d.model.name+' · 实时调用 '+d.model.live_requests+' 次':'未配置';$('count').textContent=d.items.filter(i=>i.kind==='text').length+' 条';$('last').textContent=dt(d.transport.last_customer_text_at||d.items.find(i=>i.kind==='text')?.received_at);
$('notice').textContent=d.mode==='shadow'?'影子模式：仅在此生成候选文案，同程不会收到。人工可以照常接待；本页每 4 秒更新，仅展示独立连接实际收到的消息，不混入历史回放。':d.mode==='auto'?'正式自动接待：新咨询会自动生成并发送；人工接管、资料不足、报价或退改承诺交人工。服务器接受不代表客户已收到。':'当前为只读或草稿模式，自动发送未启用。';
$('refresh').textContent='更新于 '+dt(d.now*1000)+' · 心跳只表示连接存活，不计入客户问题';
$('feed').innerHTML=d.items.length?d.items.map(i=>{let t=i.task;let actual=t&&['documents_model','clarification_model','clarification_prompt','handoff_notice'].includes(t.source);let s=actual?{text:t.text,evidence:t.evidence,status:t.status,product_context_verified:true}:i.simulation;let refs=[];try{refs=JSON.parse(s?.evidence||'[]')}catch{}let answer=i.kind==='card'?'已识别商品，已关联知识库，等待客户文字问题后生成模拟回复。':s?.text||statuses[s?.status]||(i.kind!=='text'?'非文本内容，交给人工查看':i.task?.status==='cancelled'?'已有新消息，此问题已合并或失效':i.task?.status==='human_review'?'资料不足或需要人工接待，未自动发送':'等待生成…');return `<article class="card"><div class="meta"><span>${esc(i.label||'客户')} · ${esc(i.customer)}${i.human_owned?' · 人工接待':''}</span><span>${esc(dt(i.received_at))} 收到</span></div><div class="bubble">${esc(i.text||'[非文本消息]')}</div><div class="label">${actual?esc((t.source==='handoff_notice'?'待人工告知 · ':t.source==='clarification_prompt'?'系统必要条件追问 · ':'')+(statuses[t.status]||t.status)):esc(i.kind==='card'?'商品上下文 · 不主动回复':s?.recomputed?'真实问题 · 按商品校正重算':s&&i.products?.length&&!s.product_context_verified?'旧候选 · 生成时未绑定商品':statuses[s?.status]||'影子分析')+' · 未发送'}</div><div class="bubble answer">${esc(answer)}</div><div class="source">${(i.products||[]).map(p=>esc(p.title)+' · 产品 '+esc(p.external_product_id)+' · '+esc(p.package_label||'')).join('；')}${i.product_context_source==='immediately_following_card'?'<br>商品依据：客户在问题后紧接着补充的商品卡':''}${i.products?.length?'<br>产品知识：'+(i.product_knowledge.length?i.product_knowledge.map(k=>esc(k.sheet)+' 第'+k.row+'行').join('；'):'没有精确匹配，需核对')+'<br>':''}${refs.length?'知识依据：'+[...new Set(refs.map(r=>r.sheet+' · 第'+r.row+'行'))].map(esc).join('；'):'暂无已验证的知识引用'}${s?' · 生成于 '+esc(dt(s.at)):''}</div></article>`}).join(''):'<div class="empty"><h2>正在等新的客户咨询</h2><p>目前还没有解析到新的客户文本。连接心跳、已读和输入状态不会作为问题展示。</p><p>新消息到达后，这里自动显示客户原话与 LLM 模拟回复。</p></div>';
const probe=d.transport.business_probe; $('platform-check').textContent=probe?(probe.state==='compared'?'服务端会话对照正常 · 最近会话活动 '+dt(probe.latest_session_activity_at)+' · 核对于 '+dt(probe.checked_at):probe.state==='socket_gap_detected'?'接收异常：服务端发现新文字，但连接器尚未收到，正在排查。':'服务端会话对照暂不可用 · '+dt(probe.checked_at)):'正在等待服务端会话对照'; $('diagnostics').textContent='收包计数 '+JSON.stringify(d.transport.packet_counts||{})+'；协议计数 '+JSON.stringify(d.transport.protocol_counts||{})+'；'+d.event_types.map(t=>'类型 '+t.message_type+' / '+t.content_type+'：'+t.count).join('；')||'尚无新事件';
}catch(e){$('connection').textContent='状态读取失败';$('refresh').textContent='状态读取异常，正在重试；请返回接待台核对当前模式。'}}refresh();setInterval(refresh,4000);
</script></html>
